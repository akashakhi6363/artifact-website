<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artifact</title>
    <link rel="icon" type="image/jpeg" href="/assets/logo.jpg">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Georgia, serif;
            background-image: url("/assets/artifact.jpeg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            min-height: 100vh;
            color: white;
        }

        .page {
            min-height: 100vh;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 30px;
            padding: 30px;
        }

        .gold-statue {
            position: absolute;
            left: 0;
            top: 50%;
            width: 500px;
            height: 800px;
            object-fit: contain;
            object-position: left center;
            transform: translateY(-50%);
            filter: drop-shadow(0 10px 20px black);
            pointer-events: none;
        }

        .white-statue {
            width: 350px;
            height: 450px;
            object-fit: contain;
            filter: drop-shadow(0 10px 20px black);
            z-index: 1;
        }

        .content {
            width: 250px;
            z-index: 2;
        }

        .content h1 {
            font-size: 70px;
            letter-spacing: 8px;
            color: #e39d11;
            margin-bottom: 40px;
        }

        .content p {
            font-size: 19px;
            line-height: 1.7;
            color: white;
            margin-bottom: 30px;
        }

        .button {
            display: inline-block;
            padding: 12px 28px;
            border: 1px solid #d8b36a;
            border-radius: 30px;
            color: #d8b36a;
            text-decoration: none;
            transition: 0.3s;
        }

        .button:hover {
            background: #d8b36a;
            color: black;
        }

        @media (max-width: 900px) {
            .page {
                flex-direction: column;
                text-align: center;
                justify-content: flex-start;
                gap: 15px;
                padding: 30px 20px;
            }

            .gold-statue {
                position: static;
                transform: none;
                width: 220px;
                height: 260px;
                object-fit: contain;
                order: 2;
            }

            .white-statue {
                width: 280px;
                height: 330px;
                order: 1;
            }

            .content {
                width: 100%;
                max-width: 500px;
                order: 3;
            }

            .content h1 {
                font-size: 50px;
                letter-spacing: 5px;
                margin-bottom: 20px;
            }

            .content p {
                font-size: 17px;
                line-height: 1.6;
                margin-bottom: 25px;
            }
        }

        @media (max-width: 600px) {
            .page {
                min-height: 100vh;
                padding: 20px 15px 30px;
                gap: 10px;
            }

            .white-statue {
                width: 220px;
                height: 280px;
            }

            .gold-statue {
                width: 170px;
                height: 200px;
            }

            .content {
                width: 100%;
                max-width: 320px;
            }

            .content h1 {
                font-size: 38px;
                letter-spacing: 4px;
                margin-bottom: 15px;
            }

            .content p {
                font-size: 15px;
                line-height: 1.6;
                margin-bottom: 20px;
            }

            .button {
                padding: 10px 25px;
                font-size: 14px;
            }
        }

        @media (max-width: 380px) {
            .white-statue {
                width: 190px;
                height: 240px;
            }

            .gold-statue {
                width: 140px;
                height: 170px;
            }

            .content h1 {
                font-size: 32px;
                letter-spacing: 3px;
            }

            .content p {
                font-size: 14px;
            }
        }
    </style>
</head>

<body>
    <div class="page">
        <img src="/assets/india1.png" class="gold-statue" alt="Golden Artifact">
        <img src="/assets/india3.png" class="white-statue" alt="Marble Artifact">
        <div class="content">
            <h1>ARTIFACT</h1>
            <p>
                An artifact is any object made, shaped, or changed by humans,
                usually an item of cultural or historical interest like a tool,
                pottery, or weapon.
            </p>
            <a href="intro.html" class="button">
                Know More
            </a>
        </div>
    </div>
</body>

</html>
